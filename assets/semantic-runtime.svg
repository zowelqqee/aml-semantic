<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">MicroWorld semantic runtime pipeline</title>
  <desc id="desc">Raw events enter the semantic runtime. It builds entities, relationships, context and behaviour, then produces evidence for policy or machine-learning evaluation and a final audited decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61708a"/>
    </marker>
    <style>
      .title { fill: #172033; font: 600 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.5px; }
      .label { fill: #172033; font: 600 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #526078; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #61708a; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.4px; text-transform: uppercase; }
      .line { fill: none; stroke: #61708a; stroke-width: 2.5; marker-end: url(#arrow); }
      .join { fill: none; stroke: #aeb9cb; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="24" fill="#f8fafc"/>
  <text x="720" y="64" text-anchor="middle" class="small">MicroWorld pipeline</text>

  <rect x="540" y="94" width="360" height="78" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="720" y="126" text-anchor="middle" class="label">Raw event stream</text>
  <text x="720" y="151" text-anchor="middle" class="body">transactions, identities, device signals, timestamps</text>
  <path d="M720 172 L720 216" class="line"/>

  <rect x="134" y="226" width="1172" height="270" rx="20" fill="#eef4ff" stroke="#95b8f5" stroke-width="2"/>
  <text x="170" y="268" class="title">Semantic runtime engine</text>
  <text x="170" y="295" class="body">Construct explicit state before evaluation.</text>

  <rect x="174" y="337" width="236" height="104" rx="13" fill="#ffffff" stroke="#bfd2f6" stroke-width="2"/>
  <text x="292" y="379" text-anchor="middle" class="label">Entities</text>
  <text x="292" y="405" text-anchor="middle" class="body">accounts, customers, cards</text>

  <rect x="446" y="337" width="236" height="104" rx="13" fill="#ffffff" stroke="#bfd2f6" stroke-width="2"/>
  <text x="564" y="379" text-anchor="middle" class="label">Relationships</text>
  <text x="564" y="405" text-anchor="middle" class="body">links, beneficiaries, devices</text>

  <rect x="718" y="337" width="236" height="104" rx="13" fill="#ffffff" stroke="#bfd2f6" stroke-width="2"/>
  <text x="836" y="379" text-anchor="middle" class="label">Context</text>
  <text x="836" y="405" text-anchor="middle" class="body">regimes, coverage, lifecycle</text>

  <rect x="990" y="337" width="236" height="104" rx="13" fill="#ffffff" stroke="#bfd2f6" stroke-width="2"/>
  <text x="1108" y="379" text-anchor="middle" class="label">Behaviour</text>
  <text x="1108" y="405" text-anchor="middle" class="body">roles, temporal patterns, scenarios</text>

  <path d="M292 441 L292 463 L720 463 L720 532" class="join"/>
  <path d="M564 441 L564 463" class="join"/>
  <path d="M836 441 L836 463" class="join"/>
  <path d="M1108 441 L1108 463 L720 463" class="join"/>
  <path d="M720 463 L720 532" class="line"/>

  <rect x="510" y="542" width="420" height="76" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="720" y="574" text-anchor="middle" class="label">Evidence and conflicts</text>
  <text x="720" y="599" text-anchor="middle" class="body">risk, controls, confidence, missing coverage</text>
  <path d="M720 618 L720 658" class="line"/>

  <rect x="170" y="668" width="420" height="60" rx="14" fill="#172033"/>
  <text x="380" y="706" text-anchor="middle" fill="#ffffff" style="font: 600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Versioned policy</text>
  <path d="M590 698 L690 698" class="line"/>
  <rect x="700" y="668" width="250" height="60" rx="14" fill="#ffffff" stroke="#61708a" stroke-width="2"/>
  <text x="825" y="706" text-anchor="middle" class="label">Machine learning</text>
  <path d="M950 698 L1050 698" class="line"/>
  <rect x="1060" y="668" width="210" height="60" rx="14" fill="#dbeafe" stroke="#5f93e8" stroke-width="2"/>
  <text x="1165" y="693" text-anchor="middle" class="label">Decision</text>
  <text x="1165" y="715" text-anchor="middle" class="body">with audit</text>
</svg>
