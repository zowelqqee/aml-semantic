<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">MicroWorld portability across financial domains</title>
  <desc id="desc">AML and card-payment fraud use different ontologies but share the same semantic runtime pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61708a"/>
    </marker>
    <style>
      .title { fill: #172033; font: 600 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.4px; }
      .label { fill: #172033; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #526078; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #61708a; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.4px; }
      .line { fill: none; stroke: #61708a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="500" rx="24" fill="#f8fafc"/>
  <text x="720" y="60" text-anchor="middle" class="small">Portable reasoning pipeline</text>

  <rect x="100" y="110" width="320" height="280" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="260" y="157" text-anchor="middle" class="title">AML</text>
  <text x="260" y="190" text-anchor="middle" class="body">Domain ontology</text>
  <path d="M152 218 H368" stroke="#e2e8f0" stroke-width="2"/>
  <text x="155" y="255" class="label">MoneyMuleBehaviour</text>
  <text x="155" y="291" class="label">HighVelocityLayering</text>
  <text x="155" y="327" class="label">LayeringAttempt</text>

  <path d="M420 250 L520 250" class="line"/>
  <rect x="530" y="95" width="380" height="310" rx="20" fill="#172033"/>
  <text x="720" y="158" text-anchor="middle" fill="#ffffff" style="font: 600 27px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Shared semantic runtime</text>
  <text x="720" y="194" text-anchor="middle" fill="#cbd5e1" style="font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">entities · relationships · context</text>
  <text x="720" y="224" text-anchor="middle" fill="#cbd5e1" style="font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">behaviour · evidence · conflicts</text>
  <path d="M578 260 H862" stroke="#475569" stroke-width="2"/>
  <text x="720" y="304" text-anchor="middle" fill="#ffffff" style="font: 600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Same reasoning pipeline</text>
  <text x="720" y="337" text-anchor="middle" fill="#cbd5e1" style="font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Only the ontology changes.</text>
  <path d="M910 250 L1010 250" class="line"/>

  <rect x="1020" y="110" width="320" height="280" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1180" y="157" text-anchor="middle" class="title">Card-payment fraud</text>
  <text x="1180" y="190" text-anchor="middle" class="body">Domain ontology</text>
  <path d="M1072 218 H1288" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1075" y="255" class="label">CompromisedCardBehaviour</text>
  <text x="1075" y="291" class="label">CardTestingRun</text>
  <text x="1075" y="327" class="label">DeviceTakeoverPattern</text>

  <text x="720" y="454" text-anchor="middle" class="body">Evaluated in AML and IEEE-CIS fraud with domain-specific vocabularies.</text>
</svg>
